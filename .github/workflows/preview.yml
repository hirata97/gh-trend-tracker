name: PR Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# 同じPRの実行中ジョブをキャンセル
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend（Preview環境: 開発用Backendを向く）
        working-directory: apps/frontend
        env:
          # PR PreviewはBackend dev環境を向ける（本番DB破壊リスク回避）
          PUBLIC_API_URL: ${{ secrets.BACKEND_DEV_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages（Preview）
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/frontend
        run: |
          # branch名をCloudflare Pages互換の形式に変換（スラッシュ→ハイフン、28文字以内）
          BRANCH_NAME="${{ github.head_ref }}"
          SAFE_BRANCH=$(echo "$BRANCH_NAME" | sed 's/\//-/g' | cut -c1-28)

          OUTPUT=$(npx wrangler pages deploy dist \
            --project-name=gh-trend-tracker-frontend \
            --branch="$SAFE_BRANCH" 2>&1)
          echo "$OUTPUT"

          # デプロイURLを抽出
          PREVIEW_URL=$(echo "$OUTPUT" | grep -oP 'https://[^\s]+\.pages\.dev' | tail -1)
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: PR Preview URLをコメント
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.deploy.outputs.preview_url }}';
            const sha = '${{ github.event.pull_request.head.sha }}'.substring(0, 7);
            const body = [
              '## Preview デプロイ完了',
              '',
              `**Preview URL**: ${previewUrl || '（URLの取得に失敗しました。Cloudflare Pagesのダッシュボードを確認してください）'}`,
              '',
              `**コミット**: \`${sha}\``,
              '**Backend**: 開発用環境（gh-trends-db-dev）',
              '',
              '> このPreviewは開発用Backendを向いています。本番データは参照しません。',
            ].join('\n');

            // 既存のPreviewコメントを更新、なければ新規作成
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes('Preview デプロイ完了')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
