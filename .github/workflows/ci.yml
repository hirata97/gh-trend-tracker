name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # deploy.ymlからの呼び出しを許可
  workflow_call:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1: Lint
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --workspaces --if-present -- --max-warnings=0

  # Stage 2: Type check
  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

  # Stage 3: Test
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  # Stage 4: Build
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

  # Stage 5: OpenAPI validation
  openapi-validate:
    name: OpenAPI Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Validate OpenAPI spec
        run: npx --yes @redocly/cli lint docs/openapi.yaml

      - name: Check public spec is in sync
        run: diff docs/openapi.yaml apps/backend/public/openapi.yaml

  # Stage 6: Migration check
  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check migration files exist
        run: |
          if [ -z "$(ls apps/backend/migrations/*.sql 2>/dev/null)" ]; then
            echo "::error::マイグレーションファイルが見つかりません (apps/backend/migrations/*.sql)"
            exit 1
          fi
          echo "マイグレーションファイル:"
          ls -la apps/backend/migrations/*.sql

      - name: Validate drizzle-kit can generate without errors
        working-directory: apps/backend
        run: npx drizzle-kit check 2>&1 || true

  # Stage 7: OpenAPI破壊的変更検知（PRのみ）
  openapi-breaking-change:
    name: OpenAPI Breaking Change Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: OpenAPI 破壊的変更を検知
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_CHECK: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change') }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [[ "$SKIP_CHECK" == "true" ]]; then
            echo "breaking-change ラベルが付与されているため、チェックをスキップします"
            exit 0
          fi

          # oasdiff インストール
          gh release download --repo tufin/oasdiff --pattern "oasdiff_*_linux_amd64.tar.gz" --dir /tmp
          tar -xzf /tmp/oasdiff_*_linux_amd64.tar.gz -C /tmp
          sudo install /tmp/oasdiff /usr/local/bin/oasdiff
          oasdiff version

          # ベースブランチの OpenAPI spec を取得
          git fetch origin "$BASE_REF"
          git show "origin/$BASE_REF:docs/openapi.yaml" > /tmp/openapi-base.yaml

          # 破壊的変更を検知
          echo "=== OpenAPI 破壊的変更チェック ==="
          echo "ベース: origin/$BASE_REF"
          echo "PR: $(git rev-parse --short HEAD)"
          oasdiff breaking /tmp/openapi-base.yaml docs/openapi.yaml --fail-on ERR

  # Stage 8: Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high
