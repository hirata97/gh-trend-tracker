name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # deploy.ymlからの呼び出しを許可
  workflow_call:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1: Lint
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --workspaces --if-present -- --max-warnings=0

  # Stage 2: Type check
  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

  # Stage 3: Test
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  # Stage 4: Build
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

  # Stage 5: OpenAPI validation
  openapi-validate:
    name: OpenAPI Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Validate OpenAPI spec
        run: npx --yes @redocly/cli lint docs/openapi.yaml

      - name: Check public spec is in sync
        run: diff docs/openapi.yaml apps/backend/public/openapi.yaml

  # Stage 6: Migration check
  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check migration files exist
        run: |
          if [ -z "$(ls apps/backend/migrations/*.sql 2>/dev/null)" ]; then
            echo "::error::マイグレーションファイルが見つかりません (apps/backend/migrations/*.sql)"
            exit 1
          fi
          echo "マイグレーションファイル:"
          ls -la apps/backend/migrations/*.sql

      - name: Validate drizzle-kit can generate without errors
        working-directory: apps/backend
        run: npx drizzle-kit check 2>&1 || true

  # Stage 7: OpenAPI破壊的変更チェック（breaking-changeラベルでバイパス可能）
  openapi-breaking-change:
    name: OpenAPI Breaking Change Check
    runs-on: ubuntu-latest
    # PRイベントのみ実行（pushやworkflow_callはスキップ）
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: breaking-changeラベルの確認
        id: check-label
        run: |
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          if echo "$LABELS" | grep -q '"breaking-change"'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::breaking-change ラベルが付与されているため OpenAPI 破壊的変更チェックをスキップします"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: oasdiff のインストール
        if: steps.check-label.outputs.skip == 'false'
        run: |
          curl -sSfL https://raw.githubusercontent.com/tufin/oasdiff/main/install.sh | sh -s -- -b /usr/local/bin

      - name: main ブランチの openapi.yaml を取得
        if: steps.check-label.outputs.skip == 'false'
        run: |
          git show origin/main:docs/openapi.yaml > /tmp/openapi-base.yaml

      - name: 破壊的変更チェック
        if: steps.check-label.outputs.skip == 'false'
        run: |
          oasdiff breaking /tmp/openapi-base.yaml docs/openapi.yaml --format text

  # Stage 8: Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high
